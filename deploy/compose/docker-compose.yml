# Heimdall and Postgres on one Docker host. See the "Install without
# Kubernetes" guide. Needs Docker Compose 2.24 or later. Put heimdall.yaml
# and .env next to this file, then:
#   docker compose up -d
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: heimdall
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heimdall -d heimdall"]
      interval: 5s
      timeout: 3s
      retries: 20

  heimdall:
    image: ghcr.io/mrashed98/heimdall:${HEIMDALL_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://heimdall:${POSTGRES_PASSWORD}@postgres:5432/heimdall
      # Required: without them a fresh install has no admin and cannot store
      # console channel secrets.
      HEIMDALL_BOOTSTRAP_ADMIN_KEY: ${HEIMDALL_BOOTSTRAP_ADMIN_KEY:?set HEIMDALL_BOOTSTRAP_ADMIN_KEY in .env}
      HEIMDALL_SECRET_KEY: ${HEIMDALL_SECRET_KEY:?set HEIMDALL_SECRET_KEY in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    env_file:
      # Variables your heimdall.yaml names (webhook URLs, SMTP passwords, ...).
      - path: channels.env
        required: false
    volumes:
      - ./heimdall.yaml:/etc/heimdall/heimdall.yaml:ro
    ports:
      # Bound to localhost: put a reverse proxy with TLS in front, or change
      # this to "8080:8080" on a trusted network.
      - "127.0.0.1:8080:8080"
    mem_limit: 1g
    cpus: 1
    # Time to finish in-flight requests on stop (a CI gate call can take
    # up to 60 s); Docker's default is 10 s.
    stop_grace_period: 75s

volumes:
  postgres:
