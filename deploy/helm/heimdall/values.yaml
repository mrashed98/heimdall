# Heimdall chart values.

image:
  repository: ghcr.io/mrashed98/heimdall
  tag: ""            # default: the chart appVersion
  pullPolicy: IfNotPresent

# The image-SBOM scanner (deploy/Dockerfile.scanner).
scannerImage:
  repository: ghcr.io/mrashed98/heimdall-scanner
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Rendered into the ConfigMap as heimdall.yaml. See heimdall.example.yaml
# in the repo for every option.
config:
  realms:
    - dev-k3s
  own_registries: []
  admins: []
  teams:
    - name: default
      webhook_env: TEAMS_WEBHOOK_DEFAULT
      realms: []
      min_severity: high
  # More alert channels (Slack, Discord, Telegram, PagerDuty, Alertmanager,
  # a generic webhook, email). Each `*_env` key names a key of
  # existingSecret; never put the secret itself here. For example:
  # channels:
  #   - type: slack
  #     name: dev-chat
  #     webhook_env: SLACK_WEBHOOK_DEV
  #     realms: [dev-k3s]
  #     min_severity: high
  #   - type: alertmanager
  #     name: am
  #     url: http://alertmanager.monitoring:9093
  #     min_severity: high
  #   - type: email
  #     name: security
  #     host: smtp.example.com
  #     username_env: SMTP_USERNAME
  #     password_env: SMTP_PASSWORD
  #     from: Heimdall <heimdall@example.com>
  #     to: [security@example.com]
  #     min_severity: high
  # Optional: set public_url and configure local and/or OIDC sign-in.
  # auth:
  #   public_url: https://heimdall.example.com
  #   # With ingress, set the controller pod CIDR(s), or clients share the
  #   # proxy IP for throttling and rate limits.
  #   trusted_proxies: ["10.42.0.0/16"]
  #   local: { enabled: true }
  #   oidc:
  #     issuer: https://id.example.com/realms/example
  #     client_id: heimdall
  #     client_secret_env: HEIMDALL_OIDC_CLIENT_SECRET
  #     groups_claim: groups
  #     role_mappings: []
  sight:
    realm: dev-k3s

# An existing Secret (SOPS-managed outside the chart). Every key becomes an
# environment variable. Expected keys:
#   DATABASE_URL, GITHUB_TOKEN, NVD_API_KEY, HEIMDALL_BOOTSTRAP_ADMIN_KEY,
#   HEIMDALL_OIDC_CLIENT_SECRET (or the name in auth.oidc.client_secret_env),
#   one TEAMS_WEBHOOK_* per `teams[].webhook_env`,
#   one key per `*_env` of each `config.channels[]` entry (webhook URLs, the
#   Telegram bot token, the PagerDuty routing key, the webhook HMAC secret,
#   SMTP or Alertmanager credentials),
#   HEIMDALL_API_KEY (an ingest-scope key, used by the scanner CronJob),
#   HEIMDALL_SECRET_KEY (optional; `openssl rand -base64 32`, back it up),
#   which encrypts secrets of alert channels added in the console.
existingSecret: heimdall-secrets

# Optional: send traces to an OTel collector (OTLP/HTTP).
otlpEndpoint: ""

resources:
  limits:
    memory: 1Gi
    cpu: "1"
  requests:
    memory: 256Mi
    cpu: 100m

terminationGracePeriodSeconds: 30

service:
  port: 8080

scanImages:
  enabled: true
  schedule: "0 */6 * * *"
  # Most images scanned per run.
  max: 20
  # Secret of type kubernetes.io/dockerconfigjson, mounted so syft can pull
  # private images. Leave empty for public images only.
  dockerConfigSecret: ""
  resources:
    limits:
      memory: 1Gi
      cpu: "1"
    requests:
      memory: 256Mi
      cpu: 100m

serviceMonitor:
  enabled: true
  # Render the ServiceMonitor even when the cluster's API list is not known
  # (ArgoCD and `helm template` render offline, so the
  # monitoring.coreos.com/v1 check fails there). Set it when the
  # Prometheus Operator CRDs are installed.
  force: false
  interval: 60s
  # Labels so kube-prometheus-stack selects it.
  labels: {}

# Not internet-exposed by default (CI runs on self-hosted runners).
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: heimdall.internal.example # legacy single-host default
  hosts: [] # overrides host when non-empty
  tls: []
