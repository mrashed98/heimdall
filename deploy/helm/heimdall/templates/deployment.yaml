apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heimdall.name" . }}
  labels:
    {{- include "heimdall.labels" . | nindent 4 }}
spec:
  # One replica: the scheduled loops are not leader-elected.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "heimdall.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heimdall.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "heimdall.name" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: heimdall
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "/etc/heimdall/heimdall.yaml"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # DATABASE_URL, GITHUB_TOKEN, NVD_API_KEY,
            # HEIMDALL_BOOTSTRAP_ADMIN_KEY and every TEAMS_WEBHOOK_*.
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- if .Values.otlpEndpoint }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otlpEndpoint | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 8
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 8
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/heimdall
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "heimdall.name" . }}
        - name: tmp
          emptyDir: {}
