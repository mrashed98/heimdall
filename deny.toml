# cargo-deny policy: advisories, licenses, bans, sources. Run: cargo deny check
[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
# openidconnect uses rsa for public-key signature verification only; Heimdall
# never exposes RSA private-key decryption. Test-only keys are ephemeral.
ignore = [{ id = "RUSTSEC-2023-0071", reason = "No RSA private-key decryption endpoint; OIDC only verifies public signatures" }]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  # quoted_printable (via lettre, email channel): public-domain-equivalent.
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
