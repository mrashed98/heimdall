# cargo-deny policy: advisories, licenses, bans, sources. Run: cargo deny check
[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
# 2026-11-14: unsafe-libyaml is unmaintained (no CVE, no safe upgrade). It is
# only reached through serde_yaml, which parses the operator-written
# heimdall.yaml and test fixtures, never untrusted input. Revisit when moving
# to a maintained YAML crate (e.g. serde-saphyr).
ignore = ["RUSTSEC-2024-0449"]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
