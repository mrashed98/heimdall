[package]
name = "heimdall"
version = "0.1.0"
edition = "2021"
description = "Lightweight dependency, vulnerability and release tracker for small Kubernetes clusters"
license = "Apache-2.0"
repository = "https://github.com/mrashed98/heimdall"
homepage = "https://mrashed98.github.io/heimdall/"
readme = "README.md"
keywords = ["vulnerability", "sbom", "kubernetes", "security", "dependency-track"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "heimdall"
path = "src/lib.rs"

[[bin]]
name = "heimdall"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cvss = "3.0.0"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
k8s-openapi = { version = "0.29", features = ["v1_33"] }
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls"] }
packageurl = "0.7.1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "chrono", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "signal"] }
url = "2.5.8"
walkdir = "2.5.0"
comfy-table = "8.0.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6.5"
