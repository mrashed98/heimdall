name: ci
on:
  push:
    # main only: PR branches are covered by pull_request (avoids running every check twice).
    branches: [main]
  pull_request:
  # The release workflow runs every check on the release tag before it
  # publishes anything.
  workflow_call:
    inputs:
      ref:
        description: "The commit or tag to check out (default: the triggering commit)"
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's when called, and inputs.ref the release
  # tag, so a release run never cancels (or is cancelled by) the push run on
  # main or another release's checks.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://heimdall:heimdall@localhost:5432/heimdall

jobs:
  # Each job runs its scripts/check.sh steps, so a local `scripts/check.sh`
  # runs what CI runs (scripts/check_ci_sync.py keeps the two in step).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: scripts/check.sh web

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Formatting; version strings match Cargo.toml; doc links to repo
      # files exist; CI and check.sh run the same checks.
      # ci-sync reads the workflows as YAML.
      - run: python3 -c "import yaml" || sudo apt-get install -y python3-yaml
      - run: scripts/check.sh fmt versions links ci-sync

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh clippy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: heimdall
          POSTGRES_USER: heimdall
          POSTGRES_PASSWORD: heimdall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heimdall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh test

  helm:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - run: scripts/check.sh helm

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: scripts/check.sh audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - name: Build heimdall image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=heimdall
          cache-to: type=gha,mode=max,scope=heimdall
      - name: Build scanner image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.scanner
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,mode=max,scope=scanner
