name: ci
on:
  push:
    # main only: PR branches are covered by pull_request (avoids running every check twice).
    branches: [main]
  pull_request:
  # The release workflow runs every check on the release tag before it
  # publishes anything.
  workflow_call:
    inputs:
      ref:
        description: "The commit or tag to check out (default: the triggering commit)"
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's when called, so a release run never
  # cancels (or is cancelled by) the push run on main.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://heimdall:heimdall@localhost:5432/heimdall

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      # The version strings listed in scripts/release_version.py match
      # Cargo.toml. (Skipped only for tags made before the scripts existed.)
      - if: hashFiles('scripts/release_version.py') != ''
        run: python3 scripts/release_version.py check
      # Every link from the docs to a file of this repo points at a file
      # that exists.
      - if: hashFiles('scripts/check_repo_links.py') != ''
        run: python3 scripts/check_repo_links.py

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: heimdall
          POSTGRES_USER: heimdall
          POSTGRES_PASSWORD: heimdall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heimdall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  helm:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - run: helm lint deploy/helm/heimdall
      - name: Validate manifests (no ServiceMonitor CRD)
        run: helm template h deploy/helm/heimdall | kubeconform -strict -summary
      - name: Validate auth configuration and secret wiring
        run: |
          helm template h deploy/helm/heimdall --set config.auth.public_url=https://heimdall.example.com --set config.auth.local.enabled=true --set config.auth.oidc.issuer=https://id.example.com --set config.auth.oidc.client_id=heimdall --set config.auth.oidc.client_secret_env=HEIMDALL_OIDC_CLIENT_SECRET > auth.yaml
          grep -q 'public_url: https://heimdall.example.com' auth.yaml
          grep -q 'client_secret_env: HEIMDALL_OIDC_CLIENT_SECRET' auth.yaml
          grep -q 'name: heimdall-secrets' auth.yaml
          kubeconform -strict -summary auth.yaml
      - name: Validate enabled ingress with multiple hosts
        run: |
          helm template h deploy/helm/heimdall --set ingress.enabled=true --set 'ingress.hosts[0]=one.example.com' --set 'ingress.hosts[1]=two.example.com' > ingress.yaml
          grep -q 'host: "one.example.com"' ingress.yaml
          grep -q 'host: "two.example.com"' ingress.yaml
          kubeconform -strict -summary ingress.yaml
      - name: Validate manifests (with ServiceMonitor CRD)
        run: |
          helm template h deploy/helm/heimdall --api-versions monitoring.coreos.com/v1 \
            | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS"
      - name: Validate manifests (ServiceMonitor forced, offline render)
        run: |
          helm template h deploy/helm/heimdall --set serviceMonitor.force=true > forced.yaml
          grep -q 'kind: ServiceMonitor' forced.yaml
          kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" forced.yaml
      - name: ClusterRole must not grant secrets (ADR 0003)
        run: |
          helm template h deploy/helm/heimdall --api-versions monitoring.coreos.com/v1 > rendered.yaml
          grep -q 'kind: ClusterRole' rendered.yaml
          awk 'BEGIN { RS = "\n---\n" } /kind: ClusterRole\n/ && /secrets/ { print "ClusterRole mentions secrets:"; print; bad = 1 } END { exit bad }' rendered.yaml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - name: Build heimdall image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=heimdall
          cache-to: type=gha,mode=max,scope=heimdall
      - name: Build scanner image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.scanner
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,mode=max,scope=scanner
