name: ci
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

env:
  DATABASE_URL: postgres://heimdall:heimdall@localhost:5432/heimdall

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: heimdall
          POSTGRES_USER: heimdall
          POSTGRES_PASSWORD: heimdall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heimdall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Everything below runs only for version tags (v0.1.0).
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: heimdall-linux-amd64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: heimdall-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --bin heimdall --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/heimdall ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.repo }}:latest
      # The scanner is amd64 only (its syft checksum is pinned per architecture).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.scanner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}-scanner:${{ github.ref_name }}
            ${{ steps.meta.outputs.repo }}-scanner:latest
