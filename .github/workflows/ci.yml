name: ci
on:
  push:
    # main only: PR branches are covered by pull_request (avoids running every check twice).
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DATABASE_URL: postgres://heimdall:heimdall@localhost:5432/heimdall

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: heimdall
          POSTGRES_USER: heimdall
          POSTGRES_PASSWORD: heimdall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heimdall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  helm:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - run: helm lint deploy/helm/heimdall
      - name: Validate manifests (no ServiceMonitor CRD)
        run: helm template h deploy/helm/heimdall | kubeconform -strict -summary
      - name: Validate manifests (with ServiceMonitor CRD)
        run: |
          helm template h deploy/helm/heimdall --api-versions monitoring.coreos.com/v1 \
            | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS"
      - name: Validate manifests (ServiceMonitor forced, offline render)
        run: |
          helm template h deploy/helm/heimdall --set serviceMonitor.force=true > forced.yaml
          grep -q 'kind: ServiceMonitor' forced.yaml
          kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" forced.yaml
      - name: ClusterRole must not grant secrets (ADR 0003)
        run: |
          helm template h deploy/helm/heimdall --api-versions monitoring.coreos.com/v1 > rendered.yaml
          grep -q 'kind: ClusterRole' rendered.yaml
          awk 'BEGIN { RS = "\n---\n" } /kind: ClusterRole\n/ && /secrets/ { print "ClusterRole mentions secrets:"; print; bad = 1 } END { exit bad }' rendered.yaml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build heimdall image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=heimdall
          cache-to: type=gha,mode=max,scope=heimdall
      - name: Build scanner image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.scanner
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,mode=max,scope=scanner

  # Everything below runs only for version tags (v0.1.0).
  # The tag, the chart's appVersion and the crate version must agree: the
  # chart pulls the image tagged with its appVersion.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must be v + Chart.yaml appVersion + Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME}"
          app="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' deploy/helm/heimdall/Chart.yaml)"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "tag=${tag} appVersion=${app} cargo=${crate}"
          if [ "${tag}" != "v${app}" ] || [ "${tag}" != "v${crate}" ]; then
            echo "::error::tag ${tag} must equal v${app} (Chart.yaml appVersion) and v${crate} (Cargo.toml)"
            exit 1
          fi

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, fmt, clippy, test, helm, audit, docker, version]
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: heimdall-linux-amd64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: heimdall-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --bin heimdall --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/heimdall ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # One job creates the release and attaches every binary, so the matrix
  # jobs never race to create the same release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: heimdall-linux-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: heimdall-linux-*
          fail_on_unmatched_files: true

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, fmt, clippy, test, helm, audit, docker, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Images are tagged with the version without the `v` (0.1.0), the
      # tag the chart's default (`.Chart.AppVersion`) pulls.
      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.repo }}:latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.scanner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}-scanner:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.repo }}-scanner:latest
