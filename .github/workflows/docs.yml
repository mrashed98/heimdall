name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # No path filter on pull requests: the build is fast, and a path-filtered
  # job would never report, which blocks PRs once `docs` is a required check.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a push or manual run, so an in-flight Pages deploy finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: docs/site

jobs:
  # Always builds (it is fast), on pull requests and on pushes. The name is
  # `docs` so it can become a required check.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # lastUpdated reads each page's git history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      # Fails on broken internal links (starlight-links-validator).
      - run: scripts/check.sh docs
        working-directory: .
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
