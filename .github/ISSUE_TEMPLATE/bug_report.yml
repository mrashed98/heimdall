name: Bug report
description: Something in Heimdall does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Config snippet (remove secrets), commands, SBOM shape.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
  - type: input
    id: version
    attributes:
      label: Heimdall version
      placeholder: "heimdall --version"
    validations: { required: true }
